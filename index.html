<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MAX ↔ Bitrix24</title>
  <script src="https://api.bitrix24.com/api/v1/"></script>
  <style>
    body{font:15px Segoe UI,Arial,sans-serif;background:#f5f7fa;color:#1f2937;margin:0;padding:28px}
    main{max-width:620px;margin:auto;background:#fff;padding:24px;border-radius:14px;box-shadow:0 8px 30px #0001}
    .error{color:#b42318;background:#fff1f0;padding:12px;border-radius:8px}
  </style>
</head>
<body><main><h2>MAX</h2><p id="status">Подключаюсь к интеграции…</p></main>
<script>
  const statusNode = document.getElementById('status');
  const fail = message => { statusNode.className = 'error'; statusNode.textContent = message; };
  const token = new URLSearchParams(location.search).get('accessToken');
  if (!token) fail('Bitrix24 не передал ключ запуска интеграции.');
  else BX24.init(async () => {
    try {
      const info = BX24.placement.info();
      const typeByPlacement = {
        CRM_LEAD_DETAIL_TOOLBAR: 'LEAD',
        CRM_CONTACT_DETAIL_TOOLBAR: 'CONTACT',
        CRM_DEAL_DETAIL_TOOLBAR: 'DEAL'
      };
      const entityType = typeByPlacement[info.placement];
      const entityId = Number(info.options && info.options.ID);
      if (!entityType || !Number.isInteger(entityId) || entityId < 1)
        throw new Error('Не удалось определить открытую карточку CRM.');

      const response = await fetch(
        'https://api.github.com/repos/cherep1992obor-byte/max-bitrix-launcher/contents/endpoint.json?t=' + Date.now(),
        { cache: 'no-store', headers: { Accept: 'application/vnd.github+json' } });
      if (!response.ok) throw new Error('Не удалось получить текущий адрес интеграции.');
      const documentInfo = await response.json();
      const decoded = decodeURIComponent(escape(atob((documentInfo.content || '').replace(/\s/g, ''))));
      const endpoint = JSON.parse(decoded);
      const candidates = Array.from(new Set(
        (Array.isArray(endpoint.baseUrls) ? endpoint.baseUrls : [endpoint.baseUrl])
          .filter(value => /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/i.test(value || ''))));
      if (!candidates.length) throw new Error('Опубликованный адрес интеграции некорректен.');

      const probes = candidates.map(async baseUrl => {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 5000);
        try {
          const probe = await fetch(baseUrl + '/bitrix/ping?t=' + Date.now(), {
            cache: 'no-store', signal: controller.signal
          });
          if (!probe.ok) throw new Error('Туннель не отвечает.');
          return baseUrl;
        } finally { clearTimeout(timeout); }
      });
      let baseUrl;
      try { baseUrl = await Promise.any(probes); }
      catch { throw new Error('Оба канала интеграции временно недоступны. Повторите через несколько секунд.'); }

      const form = document.createElement('form');
      form.method = 'post';
      form.action = baseUrl + '/bitrix/launch';
      for (const [name, value] of Object.entries({ accessToken: token, entityType, entityId })) {
        const input = document.createElement('input');
        input.type = 'hidden'; input.name = name; input.value = String(value);
        form.appendChild(input);
      }
      document.body.appendChild(form);
      form.submit();
    } catch (error) {
      fail(error && error.message ? error.message : 'Интеграция сейчас недоступна.');
    }
  });
</script></body></html>
